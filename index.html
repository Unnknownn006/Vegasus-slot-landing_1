     script-written storage after 7 days of inactivity.

     To make the limit hold properly, decide the view server-side
     (edge worker + KV, or a one-time signed link) and set
     data-visit on <html> before the response is sent. The rest of
     this file needs no changes for that.

     Query params:
       ?preview=1   bypass the gate, do not record a visit  (QA, affiliates)
       ?reset=1     clear the record and start over
  ═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var GATE = {
    key: 'vg_demo_seen_v1',
    cookieDays: 30,
    markOn: 'load'          // 'load' = counted the moment they arrive
  };

  var root = document.documentElement;
  var qs = new URLSearchParams(location.search);

  function readCookie(name) {
    return document.cookie.split('; ').some(function (c) {
      return c.indexOf(name + '=') === 0;
    });
  }
  function writeCookie(name, days) {
    try {
      document.cookie = name + '=1; max-age=' + (days * 86400) +
                        '; path=/; SameSite=Lax';
    } catch (e) {}
  }
  function clearCookie(name) {
    try { document.cookie = name + '=; max-age=0; path=/'; } catch (e) {}
  }

  // ?reset=1 — wipe and behave as a first visit
  if (qs.has('reset')) {
    try { localStorage.removeItem(GATE.key); } catch (e) {}
    clearCookie(GATE.key);
    root.dataset.visit = 'first';
    return;
  }

  // ?preview=1 — always show the game, never record anything
  if (qs.has('preview')) {
    root.dataset.visit = 'first';
    root.dataset.preview = '1';
    return;
  }

  // Two independent stores. Either one having a record means "seen".
  // Wrapped because private mode can throw on localStorage access.
  var seen = false;
  try { seen = localStorage.getItem(GATE.key) !== null; } catch (e) {}
  if (!seen) seen = readCookie(GATE.key);

  if (seen) {
    root.dataset.visit = 'returning';
    return;
  }

  root.dataset.visit = 'first';

  if (GATE.markOn === 'load') {
    try { localStorage.setItem(GATE.key, String(Date.now())); } catch (e) {}
    writeCookie(GATE.key, GATE.cookieDays);
  }
})();
</script>

<style>
/* ============================================================
   VEGASUS — FREE SPINS DEMO
   One unified game surface. Soft pink neon over plum.
   Vanilla CSS, no framework, no build step.

   ALL BRAND VALUES LIVE IN THE TOKEN BLOCK BELOW.
   Nothing further down hardcodes a color. Paste the Figma
   values in here and the whole surface re-skins.
   ============================================================ */

:root {
  /* ── PRIMARY: Vegasus pink (§23, §24) ─────────────────── */
  --pink-600: #EB50C8;
  --pink-500: #F05ACF;
  --pink-400: #F65FD6;
  --pink-300: #FF64DC;
  --pink-200: #FF9AE8;

  /* The values above are the ones specified in the brief. The real logo
     asset is built from a more saturated magenta ramp — these are read
     straight out of its gradient stops:

       #CA1CBE   deep magenta   (mark, shadow end)
       #FC38F8   bright magenta (mark, core)
       #FF66F5   light pink
       #FF69FC   light pink

     Paste these over the five tokens above to make the UI match the logo
     exactly. Doing so shifts the whole surface a step more magenta and a
     step less rose. See README. */

  /* ── SECONDARY: soft violet ───────────────────────────── */
  --violet-500: #9A6BFF;
  --violet-400: #B184FF;

  /* ── BACKGROUND: soft plum, not near-black (§24, §55) ─── */
  --plum-900: #1F0F24;
  --plum-800: #251329;
  --plum-700: #321735;
  --plum-600: #3E1E44;

  /* ── HIGHLIGHT ────────────────────────────────────────── */
  --lavender: #F8EFFF;
  --white: #FFFFFF;

  /* ── TEXT ─────────────────────────────────────────────── */
  --text:      #F8EFFF;
  --text-soft: #DCC4E2;
  --text-dim:  #A98BB2;

  /* ── SLOT CELLS ───────────────────────────────────────── */
  --cell-top: #FFFFFF;
  --cell-bot: #F3E5F8;

  /* ── REWARD ACCENT — small use only (§24) ─────────────── */
  --gold: #FFC978;

  /* ── TYPE (§53) ───────────────────────────────────────── */
  --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
  --font-body:    "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-emoji:   "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;

  /* ── RADIUS ───────────────────────────────────────────── */
  --r-cell: 14px;
  --r-md: 20px;
  --r-lg: 26px;
  --r-shell: 34px;

  /* ── SPACING ──────────────────────────────────────────── */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;
  --s-4: 16px; --s-5: 22px; --s-6: 30px; --s-7: 40px;

  /* ── REEL GEOMETRY (JS measures real pitch, never assumes) ── */
  --cell-h:   clamp(70px, 18vw, 96px);
  --cell-w:   clamp(70px, 18vw, 96px);
  --cell-gap: clamp(7px, 1.6vw, 11px);
  --symbol:   clamp(33px, 8.6vw, 46px);

  /* ── MOTION ───────────────────────────────────────────── */
  --ease-out:    cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: clamp(var(--s-3), 3vw, var(--s-6));
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 18%, rgba(255, 100, 220, .16), transparent 46%),
    radial-gradient(circle at 82% 84%, rgba(154, 107, 255, .13), transparent 42%),
    linear-gradient(145deg, var(--plum-800), var(--plum-700) 50%, var(--plum-900));
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer;
         -webkit-tap-highlight-color: transparent; }

:focus-visible { outline: 2px solid var(--pink-200); outline-offset: 3px; border-radius: var(--s-3); }

[hidden] { display: none !important; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

/* ============================================================
   AMBIENT ENVIRONMENT — deliberately darker than the surface
   ============================================================ */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

.ambient__glow { position: absolute; border-radius: 50%; filter: blur(90px); }

.ambient__glow--pink {
  width: 62vmax; height: 62vmax; top: -28vmax; left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(235, 80, 200, .34), transparent 68%);
  animation: drift 15s var(--ease-in-out) infinite;
}

.ambient__glow--violet {
  width: 48vmax; height: 48vmax; bottom: -22vmax; right: -12vmax;
  background: radial-gradient(circle, rgba(154, 107, 255, .26), transparent 70%);
  animation: drift 20s var(--ease-in-out) infinite reverse;
}

@keyframes drift {
  0%, 100% { transform: translateX(-50%) scale(1);    opacity: .8; }
  50%      { transform: translateX(-50%) scale(1.12); opacity: 1;  }
}

/* ============================================================
   §2 / §27 THE UNIFIED GAME CONTAINER
   Lighter than its surroundings, glassy, one single surface.
   ============================================================ */
.vegasus-game {
  position: relative;
  z-index: 1;
  isolation: isolate;
  width: min(100%, 520px);
  display: grid;
  justify-items: center;
  gap: clamp(var(--s-4), 2.4vh, var(--s-6));
  padding: clamp(var(--s-5), 4vw, var(--s-7)) clamp(var(--s-4), 4vw, var(--s-6));
  text-align: center;

  border-radius: var(--r-shell);
  border: 1px solid rgba(255, 100, 220, .30);
  background:
    radial-gradient(120% 62% at 50% 0%, rgba(255, 154, 232, .16), transparent 62%),
    linear-gradient(165deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .035)),
    linear-gradient(165deg, var(--plum-600), var(--plum-800));
  backdrop-filter: blur(20px) saturate(1.15);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .20),
    inset 0 -30px 60px -40px rgba(235, 80, 200, .40),
    0 0 70px rgba(235, 80, 200, .16),
    0 34px 80px -34px rgba(20, 6, 24, .85);
  transition: border-color 700ms var(--ease-out), box-shadow 700ms var(--ease-out);
}

.vegasus-game.is-won {
  border-color: rgba(255, 154, 232, .58);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .26),
    inset 0 -30px 70px -38px rgba(255, 100, 220, .55),
    0 0 110px rgba(255, 100, 220, .28),
    0 34px 80px -34px rgba(20, 6, 24, .85);
}

/* Signature: a soft pink bloom that expands from the payline on the win */
.game__bloom {
  position: absolute;
  left: 50%; top: 52%;
  width: 120%; aspect-ratio: 1;
  transform: translate(-50%, -50%) scale(.6);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 100, 220, .30), transparent 62%);
  opacity: 0;
  pointer-events: none;
  z-index: -1;
  transition: opacity 900ms var(--ease-out), transform 1400ms var(--ease-out);
}
.vegasus-game.is-won .game__bloom { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.game__wings {
  position: absolute;
  left: 50%; top: 50%;
  width: 132%; height: auto;
  transform: translate(-50%, -46%);
  opacity: .10;
  pointer-events: none;
  z-index: -1;
  transition: opacity 900ms var(--ease-out);
}
.vegasus-game.is-won .game__wings { opacity: .48; }

/* ============================================================
   MUTE CONTROL
   ============================================================ */
.mute {
  position: absolute;
  top: clamp(12px, 3vw, 18px);
  right: clamp(12px, 3vw, 18px);
  z-index: 4;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--text-dim);
  background: rgba(255, 255, 255, .05);
  box-shadow: inset 0 0 0 1px rgba(255, 154, 232, .18);
  transition: color 220ms var(--ease-out), background 220ms var(--ease-out);
}
.mute:hover { color: var(--pink-200); background: rgba(255, 154, 232, .12); }
.mute svg { width: 19px; height: 19px; }

/* Show whichever icon matches the current state */
.mute .mute__off { display: none; }
.mute[aria-pressed="true"] .mute__on  { display: none; }
.mute[aria-pressed="true"] .mute__off { display: block; }

/* ============================================================
   §28 BRAND
   ============================================================ */
.brand { display: grid; place-items: center; min-height: 48px; }

/* Logo is 111 x 44. Inlined as SVG, so the ratio is declared explicitly. */
.brand__asset {
  height: clamp(38px, 8.5vw, 48px);
  width: auto;
  aspect-ratio: 111 / 44;
  display: block;
  overflow: visible;
}

.brand__fallback {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(19px, 4.6vw, 26px);
  letter-spacing: .30em;
  text-indent: .30em;
  text-transform: uppercase;
  background: linear-gradient(94deg, var(--pink-200), var(--white) 46%, var(--violet-400));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ============================================================
   §21 / §22 SPIN COUNTER
   ============================================================ */
.counter { display: grid; justify-items: center; gap: var(--s-2); }

.counter__dots { display: flex; gap: var(--s-2); }

.counter__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .14);
  box-shadow: inset 0 0 0 1px rgba(255, 154, 232, .28);
  transition: background 500ms var(--ease-out), box-shadow 500ms var(--ease-out), opacity 500ms var(--ease-out);
}

.counter__dot.is-active {
  background: linear-gradient(150deg, var(--pink-300), var(--pink-600));
  box-shadow: 0 0 12px rgba(255, 100, 220, .70);
}

/* Spent spins fade back quietly. No red, no warning state (§22). */
.counter__dot.is-spent { opacity: .38; }

.counter__text {
  margin: 0;
  font-size: clamp(10px, 2.4vw, 12px);
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color 500ms var(--ease-out);
}

.vegasus-game.is-won .counter__text { color: var(--pink-200); }

/* ============================================================
   §29 SLOT
   ============================================================ */
.slot { width: 100%; display: grid; justify-items: center; }

.slot__tray {
  position: relative;
  padding: clamp(10px, 2.2vw, 15px);
  border-radius: var(--r-lg);
  border: 1px solid rgba(255, 154, 232, .22);
  background:
    linear-gradient(180deg, rgba(31, 15, 36, .62), rgba(62, 30, 68, .40));
  box-shadow:
    inset 0 2px 14px rgba(20, 6, 24, .55),
    0 14px 34px -20px rgba(235, 80, 200, .55);
}

.reels {
  display: grid;
  grid-template-columns: repeat(3, var(--cell-w));
  gap: var(--cell-gap);
}

.reel {
  position: relative;
  height: calc(3 * var(--cell-h) + 2 * var(--cell-gap));
  overflow: hidden;
  border-radius: var(--r-md);
}

/* Depth at the drum edges, tinted plum rather than black */
.reel::before, .reel::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  height: 20%;
  z-index: 2;
  pointer-events: none;
}
.reel::before { top: 0;    background: linear-gradient(to bottom, rgba(31, 15, 36, .78), transparent); }
.reel::after  { bottom: 0; background: linear-gradient(to top,    rgba(31, 15, 36, .78), transparent); }

.reel-track {
  display: grid;
  grid-auto-rows: var(--cell-h);
  gap: var(--cell-gap);
  will-change: transform;
  transform: translate3d(0, 0, 0);
}

.symbol-cell {
  display: grid;
  place-items: center;
  border-radius: var(--r-cell);
  background: linear-gradient(178deg, var(--cell-top), var(--cell-bot));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .95),
    inset 0 -3px 8px rgba(235, 80, 200, .16),
    0 2px 6px rgba(20, 6, 24, .28);
}

.symbol-cell__glyph {
  font-family: var(--font-emoji);
  font-size: var(--symbol);
  line-height: 1;
  transform: translateZ(0);
  transition: transform 480ms var(--ease-out);
}

/* §35 matching symbols scale up and glow */
.symbol-cell.is-win {
  background: linear-gradient(178deg, var(--white), #FFE9FA);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 1),
    0 0 26px rgba(255, 100, 220, .70);
}
.symbol-cell.is-win .symbol-cell__glyph { transform: scale(1.14); }

/* §17 motion blur during the fast phase */
.reel.is-blurring .reel-track { filter: blur(2.4px); }

/* ── §20 Center payline ───────────────────────────────── */
.payline {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: var(--cell-h);
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 3;
}

.payline__rule {
  position: absolute;
  left: 5%; right: 5%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 154, 232, .60) 24%, rgba(255, 154, 232, .60) 76%, transparent);
  opacity: .45;
  transition: opacity 500ms var(--ease-out), background 600ms var(--ease-out), box-shadow 600ms var(--ease-out);
}
.payline__rule--top    { top:    calc(-1 * var(--cell-gap) / 2); }
.payline__rule--bottom { bottom: calc(-1 * var(--cell-gap) / 2); }

.vegasus-game.is-spinning .payline__rule { opacity: .85; }

.vegasus-game.is-won .payline__rule {
  opacity: 1;
  background: linear-gradient(90deg, transparent, var(--pink-300) 20%, var(--lavender) 50%, var(--pink-300) 80%, transparent);
  box-shadow: 0 0 16px rgba(255, 100, 220, .85);
}

/* ============================================================
   §30 / §31 ACTION ZONE — SPIN becomes the reward, in place
   ============================================================ */
.action {
  width: 100%;
  display: grid;
  justify-items: center;
  min-height: clamp(112px, 26vw, 136px);
  align-content: center;
}

.spin {
  position: relative;
  width: clamp(112px, 27vw, 134px);
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--pink-600) 0%, var(--pink-300) 65%, var(--violet-400) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .42),
    inset 0 -10px 22px rgba(150, 30, 120, .38),
    0 0 30px rgba(255, 100, 220, .38),
    0 16px 34px -16px rgba(20, 6, 24, .70);
  transition: transform 160ms var(--ease-out), box-shadow 300ms var(--ease-out),
              filter 240ms var(--ease-out), opacity 300ms var(--ease-out);
}

.spin__label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(15px, 3.8vw, 18px);
  letter-spacing: .16em;
  text-indent: .16em;
  text-transform: uppercase;
  color: var(--white);
  text-shadow: 0 2px 10px rgba(120, 20, 100, .40);
}

.spin:hover:not(:disabled) {
  filter: brightness(1.07);
  transform: translateY(-2px);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, .48),
    inset 0 -10px 22px rgba(150, 30, 120, .38),
    0 0 42px rgba(255, 100, 220, .50),
    0 20px 40px -16px rgba(20, 6, 24, .72);
}

.spin:active:not(:disabled) { transform: scale(.97); }

.spin:disabled {
  cursor: not-allowed;
  opacity: .55;
  filter: saturate(.6);
  box-shadow: inset 0 -10px 22px rgba(150, 30, 120, .30), 0 10px 24px -14px rgba(20, 6, 24, .6);
}

/* Final state: SPIN leaves, reward takes its place (§31) */
.spin.is-retiring { opacity: 0; transform: scale(.9); pointer-events: none; }

/* ============================================================
   §36 REWARD
   ============================================================ */
.reward {
  display: grid;
  justify-items: center;
  gap: var(--s-2);
  width: 100%;
}

/* §35 choreographed reveal — each element on its own beat */
.reward > * { animation: rise 560ms var(--ease-out) both; }
.reward__won   { animation-delay:  80ms; }
.reward__prize { animation-delay: 240ms; }
.reward__cta   { animation-delay: 460ms; }

.reward__won {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(13px, 3.4vw, 16px);
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: var(--pink-200);
}

/* Strongest element on the surface (§36) */
.reward__prize {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 7.6vw, 40px);
  line-height: 1.05;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--white);
  text-shadow: 0 0 34px rgba(255, 100, 220, .70);
  animation: rise 560ms var(--ease-out) 240ms both,
             prizePulse 2.6s var(--ease-in-out) 1.6s infinite;
}
.reward__prize b { color: var(--gold); font-weight: 800; }

.reward__cta {
  width: min(100%, 320px);
  margin-top: var(--s-3);
  padding: 16px var(--s-5);
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink-600) 0%, var(--pink-300) 65%, var(--violet-400) 100%);
  color: var(--white);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(12px, 3.2vw, 14px);
  letter-spacing: .12em;
  text-transform: uppercase;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .38),
    0 0 32px rgba(255, 100, 220, .42),
    0 14px 30px -14px rgba(20, 6, 24, .70);
  transition: transform 160ms var(--ease-out), filter 240ms var(--ease-out);
}
.reward__cta:hover { filter: brightness(1.08); transform: translateY(-2px); }
.reward__cta:active { transform: scale(.975); }

@keyframes rise {
  from { opacity: 0; transform: translateY(12px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

@keyframes prizePulse {
  0%, 100% { text-shadow: 0 0 34px rgba(255, 100, 220, .70); }
  50%      { text-shadow: 0 0 48px rgba(255, 100, 220, .95); }
}

/* ============================================================
   DISCLAIMER
   ============================================================ */
.disclaimer { display: grid; gap: var(--s-1); justify-items: center; }

.disclaimer__main {
  display: flex; align-items: center; gap: var(--s-2);
  margin: 0;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--text-dim);
}

.disclaimer__age {
  display: grid; place-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--text-dim);
  font-size: 9px; font-weight: 700;
}

.disclaimer__scripted {
  margin: 0;
  font-size: 10px;
  letter-spacing: .05em;
  color: var(--text-dim);
  opacity: .78;
}

/* ============================================================
   VISIT GATE — which surface is shown
   data-visit is set by the head script before first paint.
   ============================================================ */
html[data-visit="first"]     #returnScreen { display: none; }
html[data-visit="returning"] #game         { display: none; }
html[data-visit="returning"] .particles    { display: none; }

/* ============================================================
   RETURNING VISITOR SCREEN
   ============================================================ */
.vegasus-game--return {
  gap: clamp(var(--s-3), 2vh, var(--s-4));
  padding-bottom: clamp(var(--s-5), 4vw, var(--s-6));
}

.game__bloom--return { opacity: .55; transform: translate(-50%, -50%) scale(.92); }

.return__hero {
  width: clamp(196px, 58vw, 292px);
  height: auto;
  aspect-ratio: 1;
  display: block;
  margin: calc(-1 * var(--s-3)) 0 calc(-1 * var(--s-2));
  filter: drop-shadow(0 18px 38px rgba(255, 100, 220, .28));
}

.return__copy { display: grid; gap: var(--s-2); max-width: 42ch; }

.return__title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(22px, 6vw, 31px);
  line-height: 1.06;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--white);
  text-shadow: 0 0 32px rgba(255, 100, 220, .55);
}

.return__sub {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(11px, 3vw, 13px);
  letter-spacing: .18em;
  text-indent: .18em;
  text-transform: uppercase;
  color: var(--pink-200);
}

.return__body {
  margin: var(--s-1) 0 0;
  font-size: clamp(13px, 3.4vw, 15px);
  line-height: 1.55;
  color: var(--text-soft);
}

.return__cta { margin-top: var(--s-3); }

/* Short screens: the artwork yields first, the copy stays intact */
@media (max-height: 720px) {
  .return__hero { width: clamp(150px, 40vw, 210px); }
}

@media (prefers-reduced-motion: reduce) {
  .return__hero { filter: none; }
}

/* ============================================================
   PARTICLES
   ============================================================ */
.particles {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* ============================================================
   §41 / §42 RESPONSIVE
   ============================================================ */

/* Tablet */
@media (max-width: 1023px) {
  .vegasus-game { gap: clamp(var(--s-3), 2vh, var(--s-5)); }
}

/* Mobile — container takes most of the width, internal spacing stays generous */
@media (max-width: 767px) {
  :root {
    --cell-h:   clamp(66px, 21vw, 88px);
    --cell-w:   clamp(66px, 21vw, 88px);
    --symbol:   clamp(31px, 9.6vw, 42px);
  }
  body { padding: var(--s-3); align-items: start; }
  .vegasus-game { width: 100%; border-radius: var(--r-lg); }
}

/* Short screens — protect the slot and SPIN, shed everything else */
@media (max-height: 720px) and (max-width: 767px) {
  :root {
    --cell-h: clamp(56px, 18vw, 74px);
    --cell-w: clamp(56px, 18vw, 74px);
    --symbol: clamp(26px, 8vw, 36px);
  }
  .disclaimer__main { font-size: 10px; }
  .spin { width: clamp(96px, 24vw, 112px); }
}

/* Landscape phones */
@media (max-height: 500px) and (orientation: landscape) {
  body { align-items: start; }
  :root {
    --cell-h: 52px; --cell-w: 52px; --symbol: 25px;
  }
  .vegasus-game { gap: var(--s-3); padding: var(--s-4); }
}

/* ============================================================
   §44 REDUCED MOTION
   The game stays fully playable; the spectacle goes away.
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .reel.is-blurring .reel-track { filter: none; }
  .ambient__glow { animation: none; }
  .reward__prize { animation: none; }
  .particles { display: none; }
}

</style>
</head>

<script>
/* ============================================================
   VEGASUS — FREE SPINS DEMO
   Three demo spins. Vanilla JS, no dependencies.

   HOW THE OUTCOMES WORK — stated plainly, because it matters:
   this is a SCRIPTED promotional sequence, not a game of chance.
   Attempt 1 and 2 are drawn at random but re-drawn until they do
   NOT win. Attempt 3 always wins. The whole sequence is decided
   at page load, before the user touches anything, and the reel
   animation only ever travels toward a result already chosen.

   The page says so out loud in the disclaimer. Read the README
   before removing that line.
   ============================================================ */

'use strict';

/* ── §39 Configuration — the only place timings and the URL live ── */
const CONFIG = {
  // Destination for the "Claim 10 Free Spins" button on the win state.
  // The ref parameter is what attributes the signup to this demo.
  homePageUrl: 'https://vegasus.bet/?ref=FS10SL1',

  // Destination for the returning-visitor screen's CTA.
  returnUrl: 'https://vegasus.bet/fortuna-wheel',

  freeSpinsReward: 10,
  totalSpins: 3,
  spinDuration: 2200,
  reelStartStagger: 100,
  reelStopDelay: 350,

  settleDuration: 240,
  overshootPx: 18,
  blurLeadOut: 620,
  travelCells: 22,
  travelCellsPerReel: 7,

  // Reel easing. Used by BOTH the CSS transition and the tick
  // scheduler, so the sound stays locked to the motion.
  reelEasing: [0.34, 0.02, 0.12, 1],
  winRevealDelay: 620,
  // Master output level. 0.9 was the original; 1.8 is 2x.
  // A compressor sits after this, so raising it adds loudness
  // rather than clipping.
  volume: 1.8,

  // Level of the reel loop relative to everything else. The ticks
  // repeat ~20 times per spin, so they sit well under the landings
  // and the celebration rather than competing with them.
  tickVolume: 0.34,

  particlesEnabled: true,
  particleCount: 44,
  nonWinMaxAttempts: 50
};

/* ── §16 Symbols. Names give screen readers words, not bare emoji. ── */
const SYMBOLS = [
  { char: '🍋', name: 'Lemon'    },
  { char: '🍒', name: 'Cherries' },
  { char: '⭐',  name: 'Star'     },
  { char: '👑', name: 'Crown'    },
  { char: '7️⃣', name: 'Seven'    },
  { char: '💎', name: 'Diamond'  }
];

/* ── §13 Game state ── */
const gameState = {
  isSpinning: false,
  currentSpin: 0,
  remainingSpins: CONFIG.totalSpins,
  hasWon: false,
  currentResult: null,
  gameFinished: false
};

const dom = {};
let demoResults = [];
let particleEngine = null;

/* ============================================================
   ANALYTICS
   Thin wrapper over gtag. Silently does nothing if the GA script
   is blocked, fails to load, or is stripped for a market where it
   is not wanted — the demo never depends on it.
   ============================================================ */

function track(eventName, params) {
  try {
    if (typeof window.gtag === 'function') {
      window.gtag('event', eventName, params || {});
    }
  } catch (error) {
    /* analytics must never break the game */
  }
}

/* ============================================================
   HELPERS
   ============================================================ */

const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const randomSymbol = () => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/** Resolves on the element's transform transition, or on a timeout. §46: never hang. */
function afterTransform(el, ms) {
  return new Promise((resolve) => {
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      el.removeEventListener('transitionend', handler);
      resolve();
    };
    const handler = (event) => {
      if (event.propertyName === 'transform' && event.target === el) done();
    };
    el.addEventListener('transitionend', handler);
    setTimeout(done, ms + 260);
  });
}

function announce(message) {
  if (dom.status) dom.status.textContent = message;
}

/* ============================================================
   §11 / §12 RESULT GENERATION — all three decided up front
   ============================================================ */

function createResult() {
  return Array.from({ length: 3 }, () => ({
    top: randomSymbol(),
    center: randomSymbol(),
    bottom: randomSymbol()
  }));
}

/* ── §32 Only the center line counts ── */
function checkWin(result) {
  const line = result.map((reel) => reel.center.char);
  return line[0] === line[1] && line[1] === line[2];
}

/** §33 Random, but re-drawn until it is guaranteed not to win. */
function generateNonWinningResult() {
  for (let attempt = 0; attempt < CONFIG.nonWinMaxAttempts; attempt += 1) {
    const candidate = createResult();
    if (!checkWin(candidate)) return candidate;
  }
  // Bounded fallback so this can never loop forever (§10, §46).
  const forced = createResult();
  const alternatives = SYMBOLS.filter((s) => s.char !== forced[0].center.char);
  forced[1].center = alternatives[0];
  return forced;
}

/** §34 Always three matching center symbols. */
function generateWinningResult() {
  const result = createResult();
  const winner = randomSymbol();
  result.forEach((reel) => { reel.center = winner; });
  return result;
}

function buildDemoSequence() {
  const sequence = [];
  for (let i = 0; i < CONFIG.totalSpins - 1; i += 1) sequence.push(generateNonWinningResult());
  sequence.push(generateWinningResult());
  return sequence;
}

function getResultForSpin(index) {
  return demoResults[index] || generateNonWinningResult();
}

/* ============================================================
   RENDERING
   ============================================================ */

function buildCell(symbol) {
  const cell = document.createElement('div');
  cell.className = 'symbol-cell';

  const glyph = document.createElement('span');
  glyph.className = 'symbol-cell__glyph';
  glyph.textContent = symbol.char;
  glyph.setAttribute('role', 'img');
  glyph.setAttribute('aria-label', symbol.name);

  cell.appendChild(glyph);
  return cell;
}

/** Puts a reel at rest showing exactly its three result symbols. */
function renderResult(track, triple) {
  track.style.transition = 'none';
  track.style.transform = 'translate3d(0, 0, 0)';
  track.replaceChildren(buildCell(triple.top), buildCell(triple.center), buildCell(triple.bottom));
}

/* ============================================================
   §21 SPIN COUNTER
   ============================================================ */

function updateSpinCounter() {
  if (dom.counterDots) {
    Array.from(dom.counterDots.children).forEach((dot, index) => {
      const stillAvailable = index < gameState.remainingSpins;
      dot.classList.toggle('is-active', stillAvailable);
      dot.classList.toggle('is-spent', !stillAvailable);
    });
  }

  if (!dom.counterText) return;

  if (gameState.gameFinished) {
    dom.counterText.textContent = 'Reward unlocked';
  } else if (gameState.remainingSpins === 1) {
    dom.counterText.textContent = '1 spin left';
  } else {
    dom.counterText.textContent = `${gameState.remainingSpins} spins left`;
  }
}

/* ============================================================
   §17 / §18 REEL ANIMATION
   ============================================================ */

/**
 * Spins one reel and lands it on its predetermined triple.
 * Track layout: [filler…] + [top, center, bottom] + [tail]
 * The tail exists only so the drum has somewhere to overshoot into.
 */
async function animateReel(index, triple) {
  const reel = dom.reels[index];
  const track = dom.tracks[index];
  if (!reel || !track) return;

  await wait(index * CONFIG.reelStartStagger); // §18 staggered start

  if (reducedMotion()) {
    await wait(index * 150);
    stopReel(index, triple);
    return;
  }

  const fillerCount = CONFIG.travelCells + index * CONFIG.travelCellsPerReel;
  const cells = [];
  for (let i = 0; i < fillerCount; i += 1) cells.push(buildCell(randomSymbol()));
  cells.push(buildCell(triple.top));
  cells.push(buildCell(triple.center));
  cells.push(buildCell(triple.bottom));
  cells.push(buildCell(randomSymbol()));

  track.style.transition = 'none';
  track.style.transform = 'translate3d(0, 0, 0)';
  track.replaceChildren(...cells);

  // Measure the real row pitch rather than assuming cell height + gap.
  const pitch = track.children[1].offsetTop - track.children[0].offsetTop;
  const restY = -(pitch * fillerCount);
  const duration = CONFIG.spinDuration + index * CONFIG.reelStopDelay; // §18 staggered stop

  void track.offsetHeight; // force layout so the start position registers

  scheduleReelTicks(duration, fillerCount, CONFIG.reelEasing);

  reel.classList.add('is-blurring');
  setTimeout(() => reel.classList.remove('is-blurring'),
    Math.max(0, duration - CONFIG.blurLeadOut));

  // Travel: ease in, long fast middle, firm deceleration.
  track.style.transition =
    `transform ${duration}ms cubic-bezier(${CONFIG.reelEasing.join(', ')})`;
  track.style.transform = `translate3d(0, ${restY - CONFIG.overshootPx}px, 0)`;
  await afterTransform(track, duration);

  // Settle: the drum drops back onto its stop.
  track.style.transition = `transform ${CONFIG.settleDuration}ms cubic-bezier(.2, 1.5, .5, 1)`;
  track.style.transform = `translate3d(0, ${restY}px, 0)`;
  await afterTransform(track, CONFIG.settleDuration);

  stopReel(index, triple);
}

/** Finalises one reel: trims the track so a resize can never desync it. */
function stopReel(index, triple) {
  const reel = dom.reels[index];
  const track = dom.tracks[index];
  if (!track) return;
  if (reel) reel.classList.remove('is-blurring');
  renderResult(track, triple);
  soundReelStop(index);
}

function animateReels(result) {
  return Promise.all(result.map((triple, index) => animateReel(index, triple)));
}

/* ============================================================
   §14 SPIN
   ============================================================ */

async function spin() {
  if (gameState.isSpinning) return;      // §14 double-click guard
  if (gameState.gameFinished) return;    // §50 no fourth spin
  if (gameState.remainingSpins <= 0) return;

  gameState.isSpinning = true;
  gameState.currentSpin += 1;
  gameState.currentResult = getResultForSpin(gameState.currentSpin - 1);

  dom.game.classList.add('is-spinning');
  if (dom.spinButton) dom.spinButton.disabled = true;
  announce('Reels spinning');
  soundSpinStart();
  track('demo_spin', { spin_number: gameState.currentSpin });

  // §46 Watchdog: whatever happens to the animation, the spin resolves.
  const longestReel =
    (2 * CONFIG.reelStartStagger) + CONFIG.spinDuration +
    (2 * CONFIG.reelStopDelay) + CONFIG.settleDuration;

  const watchdog = wait(longestReel + 1800).then(() => 'timeout');

  try {
    const outcome = await Promise.race([animateReels(gameState.currentResult), watchdog]);

    if (outcome === 'timeout') {
      // Force every reel to its predetermined result. The outcome never changes.
      console.warn('[Vegasus demo] Reel animation timed out. Snapping to the result.');
      gameState.currentResult.forEach((triple, index) => stopReel(index, triple));
    }
  } catch (error) {
    console.error('[Vegasus demo] Spin failed:', error);
    gameState.currentResult.forEach((triple, index) => stopReel(index, triple));
  } finally {
    gameState.remainingSpins = Math.max(0, CONFIG.totalSpins - gameState.currentSpin);
    gameState.isSpinning = false;
    dom.game.classList.remove('is-spinning');

    const isFinalSpin = gameState.currentSpin >= CONFIG.totalSpins;

    if (isFinalSpin) {
      gameState.gameFinished = true;
      gameState.hasWon = checkWin(gameState.currentResult);
      updateSpinCounter();
      showWinState(gameState.currentResult);
    } else {
      updateSpinCounter();
      if (dom.spinButton) dom.spinButton.disabled = false;
      const line = gameState.currentResult.map((r) => r.center.name).join(', ');
      announce(`${line}. ${gameState.remainingSpins} spins left.`);
      soundNoWin();
    }
  }
}

/* ============================================================
   §35 / §36 WIN STATE — transforms the lower part of the
   same container. No separate page, no modal.
   ============================================================ */

async function showWinState(result) {
  const centerLine = result.map((reel) => reel.center);

  dom.game.classList.add('is-won');

  // §35 100–300ms: matching symbols scale up
  dom.tracks.forEach((track) => {
    const centerCell = track.children[1];
    if (centerCell) centerCell.classList.add('is-win');
  });

  announce(`Three ${centerLine[0].name}. You won ${CONFIG.freeSpinsReward} free spins.`);
  soundWinStinger();
  track('demo_win', {
    symbol: centerLine[0].name,
    reward_spins: CONFIG.freeSpinsReward
  });

  const reduced = reducedMotion();
  if (!reduced) await wait(CONFIG.winRevealDelay);

  // §31 SPIN retires and the reward takes its place in the same slot.
  if (dom.spinButton) {
    dom.spinButton.disabled = true;
    dom.spinButton.classList.add('is-retiring');
    if (!reduced) await wait(280);
    dom.spinButton.hidden = true;
  }

  if (dom.reward) dom.reward.hidden = false;
  if (dom.claimButton) dom.claimButton.focus({ preventScroll: true });

  // The congratulation starts with the particles, not before them.
  if (CONFIG.particlesEnabled && !reduced && particleEngine) {
    particleEngine.emit(dom.game.getBoundingClientRect());
  }
  soundCelebration();
}

/* ============================================================
   §38 CTA
   ============================================================ */

function redirectToHome(event) {
  if (event) event.preventDefault();

  if (!CONFIG.homePageUrl || CONFIG.homePageUrl === 'PASTE_HOME_PAGE_URL_HERE') {
    console.warn('[Vegasus demo] CONFIG.homePageUrl is still the placeholder. Set it before shipping.');
    announce('Destination URL is not configured yet.');
    return;
  }

  track('claim_click', { destination: CONFIG.homePageUrl });
  window.location.href = CONFIG.homePageUrl;
}

/* ============================================================
   RESET — not wired to any UI, kept for embedding/reuse
   ============================================================ */

function resetGame() {
  gameState.isSpinning = false;
  gameState.currentSpin = 0;
  gameState.remainingSpins = CONFIG.totalSpins;
  gameState.hasWon = false;
  gameState.currentResult = null;
  gameState.gameFinished = false;

  demoResults = buildDemoSequence();

  dom.game.classList.remove('is-won', 'is-spinning');
  if (dom.reward) dom.reward.hidden = true;
  if (dom.spinButton) {
    dom.spinButton.hidden = false;
    dom.spinButton.classList.remove('is-retiring');
    dom.spinButton.disabled = false;
  }
  if (particleEngine) particleEngine.stop();

  dom.tracks.forEach((track) => {
    renderResult(track, { top: randomSymbol(), center: randomSymbol(), bottom: randomSymbol() });
  });

  updateSpinCounter();
  announce('');
}

/* ============================================================
   PARTICLES — small, slow, elegant. Not a confetti explosion (§37).
   ============================================================ */

function createParticles(canvas) {
  if (!canvas || !canvas.getContext) return null;

  const ctx = canvas.getContext('2d');
  const palette = ['#FF64DC', '#FF9AE8', '#B184FF', '#F8EFFF'];
  let motes = [];
  let frame = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function emit(rect) {
    resize();
    const originY = rect.top + rect.height * 0.52;
    motes = Array.from({ length: CONFIG.particleCount }, () => ({
      x: rect.left + Math.random() * rect.width,
      y: originY + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -0.5 - Math.random() * 1.4,
      r: 1.2 + Math.random() * 2.4,
      life: 1,
      decay: 0.0045 + Math.random() * 0.004,
      color: palette[Math.floor(Math.random() * palette.length)]
    }));
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(tick);
  }

  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let alive = false;

    motes.forEach((m) => {
      if (m.life <= 0) return;
      alive = true;
      m.x += m.vx;
      m.y += m.vy;
      m.vy *= 0.995;
      m.life -= m.decay;

      ctx.globalAlpha = Math.max(0, m.life) * 0.85;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;
    frame = alive ? requestAnimationFrame(tick) : null;
    if (!alive) ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }

  function stop() {
    if (frame) cancelAnimationFrame(frame);
    frame = null;
    motes = [];
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', () => { if (frame) resize(); });
  return { emit, stop };
}

/* ============================================================
   SOUND
   Everything is synthesised with the Web Audio API — no audio
   files, so the single-file build stays self-contained.

   Audio is only ever created inside a click handler, which is
   what browser autoplay policies require. Nothing makes a sound
   before the user presses SPIN.
   ============================================================ */

const SOUND = {
  muted: false,
  ctx: null,
  master: null,
  storageKey: 'vg_demo_muted_v1'
};

function initAudio() {
  if (SOUND.ctx) return SOUND.ctx;

  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;                       // old browser: silent, still playable

  try {
    SOUND.ctx = new Ctx();

    SOUND.master = SOUND.ctx.createGain();
    SOUND.master.gain.value = SOUND.muted ? 0 : CONFIG.volume;

    // The celebration stacks around nine voices at its peak. Without
    // this, doubling the gain would clip and crackle instead of just
    // getting louder. The compressor rides those peaks down.
    const limiter = SOUND.ctx.createDynamicsCompressor();
    limiter.threshold.setValueAtTime(-10, SOUND.ctx.currentTime);
    limiter.knee.setValueAtTime(6, SOUND.ctx.currentTime);
    limiter.ratio.setValueAtTime(8, SOUND.ctx.currentTime);
    limiter.attack.setValueAtTime(0.002, SOUND.ctx.currentTime);
    limiter.release.setValueAtTime(0.16, SOUND.ctx.currentTime);

    SOUND.master.connect(limiter);
    limiter.connect(SOUND.ctx.destination);
  } catch (error) {
    console.warn('[Vegasus demo] Audio unavailable:', error);
    SOUND.ctx = null;
  }
  return SOUND.ctx;
}

/** Safari suspends the context until a gesture; call this from click handlers. */
function resumeAudio() {
  const ctx = initAudio();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}

function setMuted(muted) {
  SOUND.muted = muted;
  if (SOUND.master && SOUND.ctx) {
    SOUND.master.gain.setTargetAtTime(
      muted ? 0 : CONFIG.volume, SOUND.ctx.currentTime, 0.02);
  }
  if (dom.muteButton) {
    dom.muteButton.setAttribute('aria-pressed', String(muted));
    dom.muteButton.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  try { localStorage.setItem(SOUND.storageKey, muted ? '1' : '0'); } catch (e) {}
}

/** One oscillator with an envelope. The building block for everything below. */
function tone(opts) {
  const ctx = SOUND.ctx;
  if (!ctx || SOUND.muted) return;

  const t = opts.at || ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(opts.from, t);
  if (opts.to && opts.to !== opts.from) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.to), t + opts.dur);
  }

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(opts.gain, t + (opts.attack || 0.004));
  gain.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);

  osc.connect(gain);
  gain.connect(SOUND.master);
  osc.start(t);
  osc.stop(t + opts.dur + 0.02);
}

/** Shared white-noise buffer. Mechanical sounds are filtered noise. */
function getNoiseBuffer() {
  const ctx = SOUND.ctx;
  if (!ctx) return null;
  if (SOUND.noiseBuffer) return SOUND.noiseBuffer;

  const length = Math.floor(ctx.sampleRate * 0.25);
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;

  SOUND.noiseBuffer = buffer;
  return buffer;
}

/** A short burst of band-passed noise — the click of a physical detent. */
function noiseBurst(opts) {
  const ctx = SOUND.ctx;
  if (!ctx || SOUND.muted) return;

  const buffer = getNoiseBuffer();
  if (!buffer) return;

  const t = opts.at || ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = opts.type || 'bandpass';
  filter.frequency.setValueAtTime(opts.freq, t);
  filter.Q.setValueAtTime(opts.q || 4, t);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(opts.gain, t + 0.0015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(SOUND.master);
  src.start(t);
  src.stop(t + opts.dur + 0.02);
}

/* ── Individual sounds ───────────────────────────────────────── */

function soundSpinStart() {
  tone({ type: 'sawtooth', from: 110, to: 340, dur: 0.28, gain: 0.05, attack: 0.02 });
}

/**
 * A reel passing one symbol.
 *
 * A real reel detent is two things at once: a sharp noise click from the
 * pawl, and a short low knock from the drum body. A pure tone reads as a
 * beep, which is why the previous version sounded electronic.
 */
function soundTick(at) {
  const jitter = 0.96 + Math.random() * 0.08;   // gentle variation, no rattle
  const level = CONFIG.tickVolume;

  // Low-passed air instead of a bandpassed crack. This removes the
  // sharp transient that made the old tick read as a hard click.
  noiseBurst({ at, type: 'lowpass', dur: 0.055, gain: 0.030 * level,
               freq: 780 * jitter, q: 0.7 });

  // Rounded body with an eased attack, so each pass swells rather
  // than snaps. The longer tail lets neighbouring ticks overlap into
  // a continuous whirr at speed.
  tone({ type: 'sine', from: 340 * jitter, to: 232, dur: 0.075,
         gain: 0.075 * level, attack: 0.010, at });
}

/**
 * A reel landing: the drum hitting its stop.
 * Pitched down per reel so the three landings feel sequential and the
 * third one carries the most weight.
 */
function soundReelStop(index) {
  const ctx = SOUND.ctx;
  if (!ctx) return;
  const t = ctx.currentTime;
  const base = 230 - index * 28;

  noiseBurst({ at: t, dur: 0.055, gain: 0.09, freq: 1500, q: 2.5 });      // impact
  tone({ type: 'sine', from: base, to: base * 0.38, dur: 0.20,
         gain: 0.22, attack: 0.002, at: t });                             // body
  tone({ type: 'triangle', from: 620, to: 300, dur: 0.07,
         gain: 0.05, at: t + 0.008 });                                    // ring
}

/** Neutral, not disappointed. §33 rules out shame-based feedback. */
function soundNoWin() {
  tone({ type: 'sine', from: 330, to: 300, dur: 0.20, gain: 0.05, attack: 0.03 });
}

/**
 * Fires the instant the third reel locks — before the reward panel.
 * Short and bright: this only has to say "that's a match", because the
 * real celebration lands a beat later with the particles.
 */
function soundWinStinger() {
  const ctx = SOUND.ctx;
  if (!ctx) return;
  const t = ctx.currentTime;

  [523.25, 783.99].forEach((freq, i) => {          // C5, G5
    tone({ type: 'triangle', from: freq, dur: 0.42, gain: 0.13,
           attack: 0.006, at: t + i * 0.07 });
  });
  tone({ type: 'sine', from: 1567.98, dur: 0.5, gain: 0.05,
         attack: 0.02, at: t + 0.14 });
}

/**
 * The congratulation, timed to start with the particles.
 *
 * Structure: a riser that builds tension, a bass note for weight, a
 * strummed major chord as the payoff, then sparkles scattered across
 * the tail so the sound keeps moving while the particles rise.
 */
function soundCelebration() {
  const ctx = SOUND.ctx;
  if (!ctx || SOUND.muted) return;
  const t = ctx.currentTime;
  const hit = t + 0.26;

  // Riser into the hit
  tone({ type: 'sawtooth', from: 220, to: 880, dur: 0.26,
         gain: 0.045, attack: 0.05, at: t });
  noiseBurst({ at: t, dur: 0.26, gain: 0.028, freq: 3200, q: 1.2 });

  // Impact
  noiseBurst({ at: hit, dur: 0.20, gain: 0.05, freq: 900, q: 1 });
  tone({ type: 'triangle', from: 130.81, dur: 1.5, gain: 0.11,
         attack: 0.012, at: hit });                          // C3, weight

  // Strummed C major, slightly staggered so it blooms rather than stabs
  [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {   // C5 E5 G5 C6
    const at = hit + i * 0.028;
    tone({ type: 'triangle', from: freq, dur: 1.4 - i * 0.1,
           gain: 0.115, attack: 0.010, at });
    tone({ type: 'sine', from: freq * 2, dur: 0.6,
           gain: 0.032, attack: 0.010, at });
  });

  // Ascending flourish over the chord
  [1046.50, 1318.51, 1567.98, 2093.00].forEach((freq, i) => {
    tone({ type: 'sine', from: freq, dur: 0.42, gain: 0.055,
           attack: 0.006, at: hit + 0.22 + i * 0.075 });
  });

  // Sparkles scattered through the tail, matching the rising motes
  for (let i = 0; i < 12; i += 1) {
    const at = hit + 0.35 + Math.random() * 1.15;
    const freq = 2000 + Math.random() * 2600;
    tone({ type: 'sine', from: freq, dur: 0.22, gain: 0.026,
           attack: 0.004, at });
  }
}

/**
 * Schedules a tick for every symbol the reel passes.
 *
 * The ticks are derived from the SAME cubic-bezier the CSS transition
 * uses, so they slow down exactly as the reel does instead of being a
 * fixed metronome. We walk the curve's parameter, watch for the reel
 * crossing each symbol boundary, and schedule a tick at that moment.
 */
function scheduleReelTicks(duration, cellCount, easing) {
  const ctx = SOUND.ctx;
  if (!ctx || SOUND.muted) return;

  const [x1, y1, x2, y2] = easing;
  const curve = (t, a, b) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;

  const start = ctx.currentTime;
  let nextBoundary = 1;
  let lastTickAt = -1;
  const minGap = 0.045;              // never tick faster than the ear resolves

  for (let i = 0; i <= 600; i += 1) {
    const t = i / 600;
    const progress = curve(t, y1, y2);
    while (progress * cellCount >= nextBoundary && nextBoundary <= cellCount) {
      const at = start + curve(t, x1, x2) * (duration / 1000);
      if (at - lastTickAt >= minGap) {
        soundTick(at);
        lastTickAt = at;
      }
      nextBoundary += 1;
    }
  }
}

/* ============================================================
   §47 INIT
   ============================================================ */

function initializeGame() {
  dom.game = document.getElementById('game');
  dom.reels = Array.from(document.querySelectorAll('.reel'));
  dom.tracks = Array.from(document.querySelectorAll('[data-track]'));
  dom.spinButton = document.getElementById('spinButton');
  dom.counterDots = document.getElementById('counterDots');
  dom.counterText = document.getElementById('counterText');
  dom.reward = document.getElementById('reward');
  dom.claimButton = document.getElementById('claimButton');
  dom.status = document.getElementById('status');
  dom.particles = document.getElementById('particles');
  dom.brandAsset = document.getElementById('brandAsset');
  dom.muteButton = document.getElementById('muteButton');
  dom.brandFallback = document.getElementById('brandFallback');

  // §46 Missing DOM must fail loudly rather than half-work.
  if (!dom.game || dom.tracks.length !== 3 || !dom.spinButton || !dom.reward) {
    console.error('[Vegasus demo] Required elements are missing. Check index.html.');
    return;
  }

  // Logo: if the asset is absent, reveal the wordmark placeholder.
  if (dom.brandAsset) {
    dom.brandAsset.addEventListener('error', () => {
      dom.brandAsset.hidden = true;
      if (dom.brandFallback) dom.brandFallback.hidden = false;
    });
  }

  // Reward figures come from CONFIG so the number lives in one place.
  document.querySelectorAll('[data-reward-count]').forEach((node) => {
    node.textContent = CONFIG.freeSpinsReward;
  });

  particleEngine = CONFIG.particlesEnabled ? createParticles(dom.particles) : null;

  // §10 / §19 The full sequence is decided here, before any interaction.
  demoResults = buildDemoSequence();

  dom.tracks.forEach((track) => {
    renderResult(track, { top: randomSymbol(), center: randomSymbol(), bottom: randomSymbol() });
  });

  dom.spinButton.addEventListener('click', () => {
    resumeAudio();          // must run inside the gesture for autoplay policy
    spin();
  });
  if (dom.claimButton) dom.claimButton.addEventListener('click', redirectToHome);

  // §14 keyboard: Space spins unless a control already has focus.
  document.addEventListener('keydown', (event) => {
    if (event.code !== 'Space') return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT') return;
    event.preventDefault();
    resumeAudio();
    spin();
  });

  // Restore the saved sound preference, defaulting to on.
  let startMuted = false;
  try { startMuted = localStorage.getItem(SOUND.storageKey) === '1'; } catch (e) {}
  setMuted(startMuted);

  if (dom.muteButton) {
    dom.muteButton.addEventListener('click', () => {
      const next = !SOUND.muted;
      setMuted(next);
      if (!next) resumeAudio();   // unmuting counts as the gesture
    });
  }

  updateSpinCounter();
}

/* ============================================================
   RETURNING VISITOR SCREEN
   ============================================================ */

function initReturnScreen() {
  track('return_screen_view');

  const cta = document.getElementById('returnCta');
  if (!cta) return;

  cta.addEventListener('click', (event) => {
    event.preventDefault();
    if (!CONFIG.returnUrl) {
      console.warn('[Vegasus demo] CONFIG.returnUrl is not set.');
      return;
    }
    track('return_cta_click', { destination: CONFIG.returnUrl });
    window.location.href = CONFIG.returnUrl;
  });
}

/* ============================================================
   BOOT — the head script already decided which surface is live.
   ============================================================ */

function boot() {
  if (document.documentElement.dataset.visit === 'returning') {
    initReturnScreen();
  } else {
    initializeGame();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
